[project]
name = "household-chore-tool"
version = "0.1.0"
description = "Household chore tracking tool (Django PWA)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<6.0",
    "django-environ>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
extend-select = ["I"]
