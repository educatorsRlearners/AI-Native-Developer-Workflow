{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chores{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'chores/chores.css' %}">
</head>
<body>
  <header>
    <h1>Household Chores</h1>
    {% if current_person %}
      <span class="current-person">{{ current_person.name }}</span>
      <form method="post" action="{% url 'chores:logout' %}" class="sign-out">
        {% csrf_token %}
        <button type="submit">Sign out</button>
      </form>
    {% else %}
      <a href="{% url 'chores:login' %}" class="sign-in-link">Sign in</a>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Household chore tool</p>
  </footer>
</body>
</html>
